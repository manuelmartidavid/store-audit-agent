# Golden entry 05 — password-gated store
# Same storefront as entry 02. The only difference is that the crawler is
# given no password. That is the whole test.
#
# This is why the entry is free: no second store, no extra setup, and the
# gate is the real Shopify password page rather than a mock of one.

store:
  platform: shopify
  vertical: null           # unknowable from behind the gate — and must stay so
  market: null
  currency: null
  password_env: null       # deliberately withheld

  aov: null
  monthly_sessions: null
  mobile_share: null
  catalog_size: null
  notes: null

eval:
  id: "05"
  path_under_test: blocked
  access: password_protected

  fixtures:
    captured_at: "2026-07-31T12:21:26+08:00"
    source: "https://torontosportscard.myshopify.com/"
    crawler_version: "0.3.0"
    lighthouse_version: "12.8.2"
    axe_core_version: "4.12.1"
    chrome_version: "149.0.7827.55"
    # Re-derived 2026-07-31 from the 0.3.0 recapture, replacing the 2026-07-28
    # pin (12899ce7…) computed from the previous one. The labels still predate
    # the bytes, so this remains a self-derived pin: it attests that scoring is
    # anchored to one capture, NOT that the labels were written against it.
    # MNC-001/MNC-002 hold regardless — the recapture reproduces the same
    # blocked shape (gate: blocked, kind: password_page, 6/6 blocked).
    manifest_sha256: "3227f61cd6c17be85f31bc088973a06c0e0d3eb49bfa79e326c723ae21fc8a0b"
    # The sentence above, in a key the scorer can read: the record prints
    # `fixture_pin: self-derived` rather than `matched`, so it stops claiming a
    # correspondence the comment beside it disclaims.
    pin_derived_after_labeling: true
    throttling: "mobile-4g-slow"
    templates_captured: []       # none reachable — this is the expected state

  expect:
    score_min: null              # null, and NOT zero — rubric §4 rule 3
    score_max: null
    max_findings: 0
    findings_above_medium: 0
    categories_required: []

    # A blocked store has exactly one correct output: no findings and no score.
    # Both are already hard pass conditions in the labels (MNC-001, MNC-002), so
    # gating them here costs nothing and closes the case where a future harness
    # change stops evaluating them.
    gates: [max_findings, score_range]

  portfolio_safe: false
